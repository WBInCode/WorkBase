server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Wersja nginx w naglowku `Server` to darmowa podpowiedz dla skanera podatnosci.
    server_tokens off;

    # Naglowki dla wszystkich lokalizacji, ktore nie maja wlasnego `add_header`.
    # Te, ktore maja (Cache-Control ponizej), wlaczaja ten plik u siebie ponownie.
    include /etc/nginx/security-headers.conf;

    # Pliki kropkowe (.env, .git/...) nie moga wpadac w SPA-fallback: zwracaly wtedy
    # 200 z trescia index.html, co skanery raportuja jako ekspozycje konfiguracji.
    # Musi byc PRZED `location /`, zeby wygrac dopasowanie.
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nigdy nie cache'owany — inaczej po deployu przeglądarka trzyma
    # starą wersję referującą nieistniejące/stare chunki JS (i brakujące trasy).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Pliki sterujące PWA muszą być zawsze rewalidowane. Gdy sw.js był objęty
    # ogólnym cache immutable na rok, przeglądarka zachowywała starą regułę
    # navigation fallback i przechwytywała backendowy /sso/callback.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /registerSW.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # API proxy
    location /api/ {
        proxy_pass http://workbase-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR/WebSocket proxy
    location /hubs/ {
        proxy_pass http://workbase-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://workbase-api:5000;
    }

    # SSO handoff z Huba ekosystemu (wb-platform) — DOKŁADNE dopasowanie, żeby nie
    # połknąć innych tras /sso/* (np. /auth/sso-bridge to SPA, nie backend).
    location = /sso/callback {
        proxy_pass http://workbase-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
