# Naglowki bezpieczenstwa dla WorkBase.
#
# Wlaczane w kazdej lokalizacji, ktora ma wlasne `add_header` — nginx dziedziczy
# naglowki z poziomu wyzej TYLKO wtedy, gdy na danym poziomie nie ma zadnego
# `add_header`. Bez tego lokalizacje z Cache-Control cicho gubilyby cala liste.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP dopasowane do faktycznych zaleznosci aplikacji (sprawdzone na produkcyjnym index.html):
#  - script-src 'self' wystarcza: w index.html NIE MA ani jednego skryptu w tresci,
#    rejestracja service workera idzie przez osobny plik /registerSW.js,
#  - style-src 'unsafe-inline' jest wymagane, bo komponenty uzywaja atrybutu style={{...}},
#  - fonts.googleapis.com/gstatic.com to rodziny wczytywane w index.html,
#  - frame-src auth.wb-partners.pl jest KONIECZNE: oidc-client-ts ma automaticSilentRenew,
#    ktory odnawia token w ukrytej ramce z Keycloakiem. Bez tego wpisu sesja urywa sie
#    po wygasnieciu tokenu i uzytkownik jest wyrzucany do logowania,
#  - connect-src obejmuje Keycloaka (discovery + wymiana tokenu) oraz SignalR po wss
#    na wlasnym hostcie (podany wprost, bo obsluga 'self' dla ws/wss zalezy od przegladarki),
#  - img-src https: pozwala pokazac awatary, logo i branding wgrywane przez klientow,
#  - frame-ancestors 'self': zaden produkt ekosystemu nie osadza WorkBase w ramce (sprawdzone).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://auth.wb-partners.pl; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auth.wb-partners.pl wss://workbase.wb-partners.pl; frame-src https://auth.wb-partners.pl; worker-src 'self' blob:; manifest-src 'self'" always;
